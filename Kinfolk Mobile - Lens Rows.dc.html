          rc: on ? 'rgba(255,255,255,.82)' : '#6E665E', nc: on ? '#FFFFFF' : '#3B352F',
          onTap: () => { if((this.chipMoved || 0) < 6) this.focusPerson(id); } };
      }),
      toast: this.tmsg || 0,
      sheet: who ? {
        title: 'Around ' + P[who][0],
        onClose: e => { e.stopPropagation(); this.sheet = null; this.kick(); },
        items: [
          mk('partner', '⇄', 'Add a partner', 'Current, former or second partner of ' + first(who), '#3D6B5A'),
          mk('child', '↓', 'Add a child', 'Opens or extends the generation below', '#B4552F'),
          mk('sibling', '↔', 'Add a sibling', 'Another child of ' + first(who) + '’s parents', '#8A6A4E'),
          mk('parents', '↑', 'Add parents', 'Opens the generation above ' + first(who), '#6E4B2E'),
        ],
      } : 0,
    };
  }
}
</script>
</body>
</html>
